name: Unzip Upload

# Ongoing content updates: drop a file named exactly "upload.zip" at the repo root
# (via GitHub's web "Add file" -> "Upload files") and this extracts it in place.
# For the ONE-TIME initial full-project setup, use project.zip + the manually
# triggered "Bootstrap Project" workflow instead - this workflow ignores project.zip.
on:
  push:
    paths:
      - "upload.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract upload.zip into the repo root
        run: |
          set -e
          if [ ! -f upload.zip ]; then
            echo "No upload.zip found at repo root - nothing to do."
            exit 0
          fi
          TMP_DIR=$(mktemp -d)
          unzip -o upload.zip -d "$TMP_DIR"
          # Never let an update zip touch .github - GitHub blocks workflow-token
          # pushes that modify .github/workflows/*.yml anyway.
          rsync -a --exclude='.github' "$TMP_DIR"/ ./
          rm -f upload.zip
          rm -rf "$TMP_DIR"

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed after extraction."
          else
            git commit -m "Auto-extract upload.zip"
            git push
          fi
