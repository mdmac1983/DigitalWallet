name: Build APK

# Runs automatically right after "Unzip Upload" or "Bootstrap Project" finishes, and can
# also be run manually from the Actions tab.
#
# Versioning: the very first build (right after Bootstrap Project) ships as whatever
# version is already in app/build.gradle.kts (starts at 1.0) with NO bump, so your first
# APK is v1.0. Every build after that - triggered by Unzip Upload or a manual run - bumps
# the version by +0.1 and appends a line to the in-app changelog before building.
#
# Signing: builds are release-signed using the keystore stored in your repo's secrets
# (RELEASE_KEYSTORE_BASE64 etc. - see SETUP_INSTRUCTIONS.md for exactly what to paste in).
# If those secrets aren't set, the build quietly falls back to debug signing so this
# workflow never breaks - but you'll want the real secrets in place for updates to install
# cleanly over previous versions.
on:
  workflow_run:
    workflows: ["Unzip Upload", "Bootstrap Project"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bump version (+0.1) and update changelog
        id: bump
        if: ${{ !(github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Bootstrap Project') }}
        run: |
          python3 - <<'PYEOF'
          import re, datetime, os

          gradle_file = "app/build.gradle.kts"
          with open(gradle_file) as f:
              content = f.read()

          code_match = re.search(r'versionCode\s*=\s*(\d+)', content)
          name_match = re.search(r'versionName\s*=\s*"(\d+)\.(\d+)"', content)
          if not code_match or not name_match:
              raise SystemExit("Could not find versionCode/versionName in " + gradle_file)

          old_code = int(code_match.group(1))
          major, minor = int(name_match.group(1)), int(name_match.group(2))

          new_code = old_code + 1
          new_name = f"{major}.{minor + 1}"

          content = content.replace(f"versionCode = {old_code}", f"versionCode = {new_code}", 1)
          content = content.replace(f'versionName = "{major}.{minor}"', f'versionName = "{new_name}"', 1)
          with open(gradle_file, "w") as f:
              f.write(content)

          changelog_file = "app/src/main/assets/changelog.txt"
          today = datetime.date.today().isoformat()
          line = f"{new_name} - {today} - Automated build (GitHub Actions run #{os.environ['GITHUB_RUN_NUMBER']})\n"
          os.makedirs(os.path.dirname(changelog_file), exist_ok=True)
          with open(changelog_file, "a") as f:
              f.write(line)

          print(f"Bumped version {major}.{minor} -> {new_name} (code {old_code} -> {new_code})")
          PYEOF

      - name: Commit version bump and changelog
        if: ${{ !(github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Bootstrap Project') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/assets/changelog.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Bump version"
            git push
          fi

      - name: Read current version for the artifact name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set - this build will fall back to debug signing."
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-wallet-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Digital Wallet v${{ steps.version.outputs.version_name }}
          body: |
            Automated build from GitHub Actions run #${{ github.run_number }}.
            See Settings → Changelog in the app for what changed in this version.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
